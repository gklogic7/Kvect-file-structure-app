<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KVect File Studio</title>
<style>
/* ===== 2. DESIGN TOKENS ===== */
:root{--bg:#1b1c21;--p:#25272e;--b:#383b45;--t:#e6e8ee;--m:#98a0b0;--a:#6c8cff;--r:8px}
[data-theme=light]{--bg:#f3f4f7;--p:#fff;--b:#d6d9e1;--t:#1c1e25;--m:#666c7a;--a:#3558e0}
/* ===== 3. LAYOUT ===== */
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--t);font:13px system-ui,Segoe UI,sans-serif}
header{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--p);border-bottom:1px solid var(--b);flex-wrap:wrap}
header b{color:var(--a);margin-right:4px}
button,input,select{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:4px 9px}
button{cursor:pointer;transition:.15s}button:hover{border-color:var(--a)}
:focus-visible{outline:2px solid var(--a);outline-offset:1px}
#main{flex:1;position:relative;min-height:0;overflow:hidden;margin:6px}
.win{position:absolute;resize:both;min-width:170px;min-height:90px;box-shadow:0 6px 24px #0006}
.win.min{display:none!important}.win.top{border-color:var(--a)}
.tbar{display:flex;gap:4px;align-items:center;padding:3px 6px;background:var(--bg);border-bottom:1px solid var(--b);cursor:grab;user-select:none;touch-action:none}
.tbar span{flex:1;font-weight:600}.tbar button{padding:0 8px;line-height:18px}
#tb{display:flex;gap:4px;padding:3px 6px;background:var(--p);border-top:1px solid var(--b);flex-wrap:wrap;min-height:30px}
#tb button.m{opacity:.55;font-style:italic}
.pan{background:var(--p);border:1px solid var(--b);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{padding:5px 8px;border-bottom:1px solid var(--b);display:flex;gap:4px;flex-wrap:wrap;align-items:center;color:var(--m)}
.pb{flex:1;overflow:auto;padding:6px;min-height:0}
.r{padding:3px 6px;border-radius:5px;cursor:pointer;white-space:nowrap}.r:hover{background:var(--bg)}.r.s{background:var(--a);color:#fff}.r.dr{outline:1px dashed var(--a)}
.ch{margin-left:12px;border-left:1px solid var(--b)}
#tabs{display:flex;overflow:auto;border-bottom:1px solid var(--b)}
.tab{padding:5px 10px;cursor:pointer;white-space:nowrap;color:var(--m);border-right:1px solid var(--b)}.tab.s{color:var(--t);background:var(--bg)}
#ew{flex:1;position:relative;background:var(--bg);min-height:0}
#ta,#hl{position:absolute;inset:0;margin:0;width:100%;height:100%;border:0;border-radius:0;padding:10px;font:13px/1.5 Consolas,Menlo,monospace;tab-size:2;white-space:pre;letter-spacing:0}
#ta{resize:none;background:transparent;color:transparent;caret-color:var(--t);z-index:1;overflow:auto}
#hl{pointer-events:none;overflow:hidden;color:var(--t)}
#hl .k{color:#c678dd}#hl .s{color:#98c379}#hl .c{color:#7f8796;font-style:italic}#hl .n{color:#d19a66}#hl .f{color:#61afef}#hl .tg{color:#e06c75}#hl .at{color:#d19a66}
[data-theme=light] #hl .k{color:#8a2be2}[data-theme=light] #hl .s{color:#22863a}[data-theme=light] #hl .f{color:#005cc5}[data-theme=light] #hl .n,[data-theme=light] #hl .at{color:#b45f06}[data-theme=light] #hl .tg{color:#c0392b}

pre{margin:0;font:12px/1.4 Consolas,monospace;white-space:pre-wrap}
.em{color:var(--m);padding:20px;text-align:center}
.ok{color:#4cc38a}.er{color:#ff6b6b}.wn{color:#e5b34a}
dialog{background:var(--p);color:var(--t);border:1px solid var(--b);border-radius:12px;max-width:min(720px,94vw);width:100%;padding:14px}
dialog::backdrop{background:#0008}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.md h1,.md h2,.md h3{margin:.6em 0 .3em}.md code,.md pre{background:var(--bg);padding:2px 4px;border-radius:4px}.md table{border-collapse:collapse}.md td,.md th{border:1px solid var(--b);padding:2px 6px}


#pt{display:flex;gap:3px;padding:3px 8px 0;overflow-x:auto;align-items:flex-end}
.pj{padding:3px 10px;border:1px solid var(--b);border-bottom:0;border-radius:6px 6px 0 0;background:var(--p);cursor:pointer;white-space:nowrap}.pj.s{background:var(--bg);color:var(--a);font-weight:600}.pj b{margin-left:6px;opacity:.6}
.pjc{flex:0 0 240px;border:1px solid var(--b);border-radius:6px}.pjc.s{border-color:var(--a)}.pjh{padding:4px 6px;background:var(--bg);cursor:pointer}.pjc pre{padding:6px;max-height:60vh;overflow:auto}
#jt{flex:1;width:100%;resize:none;border:0;border-radius:0;font:12px/1.4 Consolas,Menlo,monospace;padding:8px;background:var(--ed,var(--bg));color:var(--t);white-space:pre;tab-size:2;min-height:140px}
#w-js{min-width:300px;min-height:240px}
#jst{padding:3px 8px;font-size:12px;border-top:1px solid var(--b)}
/* ===== SKINS: colours, fonts and title-bar paint only (no layout/shape changes) ===== */
.tbar{background:var(--tb,var(--bg));color:var(--tbc,var(--t))}
.tbar button{background:var(--tbb,var(--bt,var(--bg)));color:var(--tbbc,var(--tbc,var(--t)))}
.tbar button:last-child{background:var(--tbx,var(--tbb,var(--bt,var(--bg))))}
header,#tb{background:var(--hd,var(--p));color:var(--hdc,var(--t))}
button{background:var(--bt,var(--bg))}
input,select{background:var(--ib,var(--bg))}
#ew{background:var(--ed,var(--bg))}
[data-skin=xp]{--bg:#ece9d8;--p:#f6f5ee;--b:#7f9db9;--t:#000;--m:#444;--a:#316ac5;--tb:linear-gradient(#0a5bd8,#3d95ff 8%,#0a5bd8 40%,#0a5bd8 88%,#0a47b8);--tbc:#fff;--tbbc:#fff;--tbb:linear-gradient(#3b8cff,#1a5fd6);--tbx:linear-gradient(#e8836a,#c8391a);--hd:linear-gradient(#245edb,#3f8cf3 12%,#245edb 60%,#1941a5);--hdc:#fff;--bt:linear-gradient(#fff,#ece9d8 85%,#d6d0c0);--ed:#fff;--ib:#fff}
[data-skin=xp] body{font-family:Tahoma,Verdana,sans-serif}[data-skin=xp] header b{color:#fff}[data-skin=xp] button{border-color:#003c74}
[data-skin=w95]{--bg:#c0c0c0;--p:#c0c0c0;--b:#808080;--t:#000;--m:#404040;--a:#000080;--tb:linear-gradient(90deg,#000080,#1084d0);--tbc:#fff;--tbbc:#000;--tbb:#c0c0c0;--hd:#c0c0c0;--hdc:#000;--bt:#c0c0c0;--ed:#fff;--ib:#fff}
[data-skin=w95] body{font-family:"MS Sans Serif",Tahoma,Arial,sans-serif}[data-skin=w95] button,[data-skin=w95] .pan{border-color:#fff #404040 #404040 #fff}[data-skin=w95] header b{color:#000080}
[data-skin=os9]{--bg:#dcdcdc;--p:#eee;--b:#8c8c8c;--t:#000;--m:#555;--a:#6666cc;--tb:repeating-linear-gradient(#fff 0 1px,#bdbdbd 1px 2px);--tbc:#000;--tbbc:#000;--tbb:#ddd;--hd:linear-gradient(#f6f6f6,#cfcfcf);--hdc:#000;--bt:linear-gradient(#fafafa,#cdcdcd);--ed:#fff;--ib:#fff}
[data-skin=os9] body{font-family:Charcoal,Geneva,"Lucida Grande",sans-serif}
[data-skin=aero]{--bg:#dfe9f5;--p:#f3f7fc;--b:#8aa9cf;--t:#10243e;--m:#4c5d73;--a:#2b78d4;--tb:linear-gradient(#cfe0f5,#a9c6ec 50%,#97b9e6 51%,#bcd5f3);--tbc:#10243e;--tbbc:#10243e;--tbb:linear-gradient(#e9f1fb,#c5d8f0);--tbx:linear-gradient(#e9a08f,#c2432a);--hd:linear-gradient(#dbe8f7,#b8d0ee);--hdc:#10243e;--bt:linear-gradient(#f7fbff,#d5e4f6);--ed:#fff;--ib:#fff}
[data-skin=aero] body{font-family:"Segoe UI",Tahoma,sans-serif}
[data-skin=dos]{--bg:#000;--p:#021002;--b:#1c8c1c;--t:#33ff33;--m:#1fa81f;--a:#33ff33;--tb:#1c8c1c;--tbc:#000;--tbbc:#000;--tbb:#33ff33;--hd:#021002;--hdc:#33ff33;--bt:#000;--ed:#000;--ib:#000}
[data-skin=dos] body{font-family:Consolas,"Courier New",monospace}[data-skin=dos] .r.s{color:#000}
:is([data-skin=xp],[data-skin=w95],[data-skin=os9],[data-skin=aero]) #hl .k{color:#8a2be2}:is([data-skin=xp],[data-skin=w95],[data-skin=os9],[data-skin=aero]) #hl .s{color:#22863a}:is([data-skin=xp],[data-skin=w95],[data-skin=os9],[data-skin=aero]) #hl .f{color:#005cc5}:is([data-skin=xp],[data-skin=w95],[data-skin=os9],[data-skin=aero]) #hl :is(.n,.at){color:#b45f06}:is([data-skin=xp],[data-skin=w95],[data-skin=os9],[data-skin=aero]) #hl .tg{color:#c0392b}
</style></head><body>
<!-- ===== 1. APP SHELL ===== -->
<header>
 <b>◆ KVect</b><input id="pn" aria-label="Project name" style="width:150px">
 <button data-c="newproj">New</button><button data-c="save">Save</button><button data-c="open">Open</button>
 <button data-c="import">Import</button><button data-c="zip">Export ZIP</button><button data-c="html">Export HTML</button>
 <button data-c="file">Export file</button><button data-c="jview" title="Show the Structure JSON window">JSON view</button><button data-c="jimp">Import JSON</button><button data-c="jexp">Export JSON</button><button data-c="langs">Languages</button><button data-c="assets">Assets</button>
 <button data-c="docs">Docs</button><button data-c="pal">⌘ Ctrl+K</button><button data-c="rec" id="recb">● Rec</button><button data-c="ses" id="sesb">● Session</button><button data-c="seslog">Timeline</button><button data-c="lay">Layouts</button><button data-c="wm">Windows</button><button data-c="skin">Skins</button><button data-c="theme">Theme</button><button data-c="help">?</button>
</header>
<div id="pt" aria-label="Open projects"></div>
<div id="main">
 <section class="pan win" id="w-ex" data-title="Explorer" aria-label="Explorer">
  <div class="ph"><button data-c="nf" title="New file">＋📄</button><button data-c="nd" title="New folder">＋📁</button><button data-c="ren">Rename</button><button data-c="dup">Copy</button><button data-c="del">Delete</button>
  <input id="q" placeholder="Search names/contents" style="width:100%"></div>

 </section>
 <section class="pan win" id="w-ed" data-title="Editor"><div id="tabs"></div>
  <div class="ph" id="eb"></div>
  <div id="ew"><pre id="hl" aria-hidden="true"></pre><textarea id="ta" spellcheck="false" aria-label="Editor"></textarea></div><div id="info" class="em" hidden></div>
 </section>
 <section class="pan win" id="w-pv" data-title="Preview"><div class="pb" id="pv"></div></section>
 <section class="pan win" id="w-lg" data-title="Log / export status"><div class="pb" id="log"></div></section>

 <section class="pan win" id="w-ac" data-title="Action presets"><div class="ph"><button data-c="rec">● Record / ■ Stop</button><button data-c="pimp">Import</button><button data-c="pexp">Export all</button><button data-c="pgen">+50 test presets</button><button data-c="pstress">Stress test</button><input id="pq2" placeholder="Filter presets" style="flex:1;min-width:90px"></div><div class="pb" id="ac"></div></section>
 <section class="pan win" id="w-pj" data-title="Projects overview"><div class="ph"><button data-c="padd">＋ Project</button><button data-c="psaveall">Save all</button><span>Click a header to switch. "Copy selection here" sends the Explorer selection.</span></div><div class="pb" id="pjv" style="display:flex;gap:8px;align-items:flex-start"></div></section>
 <section class="pan win" id="w-js" data-title="Structure JSON"><div class="ph"><button data-c="jload" title="Regenerate the JSON from the project">↻ Project</button><select id="jf" aria-label="JSON format"><option value="tree">Tree</option><option value="short">Shorthand</option><option value="paths">Path list</option></select><button data-c="japply" title="Create this structure inside the selected Explorer folder">Apply</button><button data-c="jnew" title="Open this JSON as a new project tab">New proj.</button><button data-c="jimp" title="Import a .json file">Import</button><button data-c="jexp" title="Export as .json">Export</button><button data-c="jfmt">Pretty</button></div><textarea id="jt" spellcheck="false" aria-label="Structure JSON" placeholder='Paste or edit JSON here, e.g. {"src":{"main.js":"console.log(1)"},"README.md":"# Hi"}'></textarea><div id="jst" class="ok"></div></section>
</div>
<div id="tb" role="toolbar" aria-label="Taskbar: click to restore or focus a window"></div>
<dialog id="dg"></dialog><input type="file" id="fi" multiple hidden>

<script>
"use strict";
/* ===== 5. HELPERS ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=p=>p.replace(/\\/g,'/').split('/').filter(x=>x&&x!='.'&&x!='..').join('/');
const ext=p=>(p.match(/\.([^./]+)$/)||[,''])[1].toLowerCase();
const KM={png:'img',jpg:'img',jpeg:'img',gif:'img',webp:'img',bmp:'img',ico:'img',svg:'svg',mp3:'aud',wav:'aud',ogg:'aud',m4a:'aud',flac:'aud',ttf:'fnt',otf:'fnt',woff:'fnt',woff2:'fnt',md:'md',json:'json',csv:'csv',html:'html',htm:'html',zip:'bin',pdf:'bin'};
const kind=p=>KM[ext(p)]||'txt';
const sz=n=>n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024).toFixed(1)+' KB':n+' B';
const du=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function log(m,c=''){const l=$('#log');l.insertAdjacentHTML('afterbegin',`<div class="${c}">${new Date().toLocaleTimeString()} ${esc(m)}</div>`)}

/* ===== 6. FILE-SYSTEM DATA MODEL / FileSystemManager ===== */
// files: path -> {c:string} (text) or {b:Blob} (binary). folders: explicit (possibly empty) dirs.
const S={name:'KVectProject',files:{},folders:new Set(),sel:'',cur:'',open:[],exp:new Set(),urls:[]};
const FS={
 dirs(){const d=new Set(S.folders);for(const p in S.files){const a=p.split('/');a.pop();let c='';for(const x of a){c+=(c?'/':'')+x;d.add(c)}}return d},
 isDir:p=>FS.dirs().has(p),
 tdir(){return !S.sel?'':FS.isDir(S.sel)?S.sel:S.sel.split('/').slice(0,-1).join('/')},
 node(root,path){let n=root,c='';for(const x of path.split('/').filter(Boolean)){c+=(c?'/':'')+x;n=n.d[x]??={d:{},f:[],p:c}}return n},
 root(){const r={d:{},f:[],p:''};for(const d of FS.dirs())FS.node(r,d);for(const p in S.files){const a=p.split('/'),nm=a.pop();FS.node(r,a.join('/')).f.push([nm,p])}return r},
 move(from,to){to=clean(to);if(!to||to==from)return;
  if(FS.isDir(from)){if(to.startsWith(from+'/'))return log('Cannot move a folder into itself','er');
   for(const p of Object.keys(S.files))if(p.startsWith(from+'/'))FS.put(to+p.slice(from.length),S.files[p],p);
   [...S.folders].forEach(d=>{if(d==from||d.startsWith(from+'/')){S.folders.delete(d);S.folders.add(to+d.slice(from.length))}})}
  else FS.put(to,S.files[from],from);
  S.open=S.open.map(o=>o==from?to:o);if(S.cur==from)S.cur=to;S.sel=to},
 put(path,f,del){if(S.files[path]&&path!=del&&!confirm('Overwrite '+path+'?'))return;if(del)delete S.files[del];S.files[path]=f},
 text(path,c){path=clean(path);if(S.files[path]&&!confirm('Overwrite '+path+'?'))return;S.files[path]={c}},
 load(map){S.files={};S.folders=new Set();for(const k in map){if(k.endsWith('/'))S.folders.add(clean(k));else S.files[clean(k)]={c:map[k]}}S.open=[];S.cur='';S.sel='';S.exp=new Set(['']);for(const d of FS.dirs())S.exp.add(d)},
 async add(dir,f){const p=clean((dir?dir+'/':'')+f.name);if(S.files[p]&&!confirm('Overwrite '+p+'?'))return;
  const buf=new Uint8Array(await f.arrayBuffer());const bin=['img','aud','fnt','bin'].includes(kind(p))||buf.subarray(0,8000).includes(0);
  S.files[p]=bin?{b:new Blob([buf],{type:f.type})}:{c:new TextDecoder().decode(buf)};return p},
 async bytes(f){return f.b?new Uint8Array(await f.b.arrayBuffer()):new TextEncoder().encode(f.c)}
};

/* ===== 7. TEMPLATE REGISTRY (add entries to extend) ===== */
const n_=()=>S.name;
const TEMPLATES={
 'Web (HTML/CSS/JS)':()=>({'index.html':`<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><title>${n_()}</title>\n<link rel="stylesheet" href="css/style.css"></head>\n<body><h1>${n_()}</h1><button id="b">Click</button><p id="o"></p>\n<script src="js/main.js"><\/script></body></html>\n`,'css/style.css':`body{font-family:system-ui;margin:2rem}\nbutton{padding:.5rem 1rem}\n`,'js/main.js':`let n=0;\ndocument.getElementById('b').onclick=()=>{document.getElementById('o').textContent='Clicks: '+(++n)};\n`,'data/config.json':`{\n  "name": "${n_()}",\n  "version": "0.1.0"\n}\n`,'README.md':`# ${n_()}\n\nOpen index.html in a browser.\n`,'assets/images/':1,'assets/fonts/':1,'assets/audio/':1}),
 'Python app':()=>({'main.py':`from src.app import run\n\nif __name__ == "__main__":\n    run()\n`,'src/app.py':`def run():\n    print("Hello from ${n_()}")\n`,'src/__init__.py':'','tests/test_app.py':`from src.app import run\n\ndef test_run(capsys):\n    run()\n    assert "Hello" in capsys.readouterr().out\n`,'requirements.txt':`pytest\n`,'config.json':`{ "debug": false }\n`,'.gitignore':`__pycache__/\n.venv/\n`,'README.md':`# ${n_()}\n\nRun: python main.py\n`}),
 'Node.js':()=>({'package.json':`{\n  "name": "${n_().toLowerCase()}",\n  "version": "0.1.0",\n  "main": "src/index.js",\n  "scripts": { "start": "node src/index.js" }\n}\n`,'src/index.js':`console.log('Hello from ${n_()}');\n`,'.gitignore':`node_modules/\n`,'README.md':`# ${n_()}\n\nnpm start\n`}),
 'Rust':()=>({'Cargo.toml':`[package]\nname = "${n_().toLowerCase()}"\nversion = "0.1.0"\nedition = "2021"\n`,'src/main.rs':`fn main() {\n    println!("Hello, world!");\n}\n`,'.gitignore':`target/\n`}),
 'Go':()=>({'go.mod':`module ${n_().toLowerCase()}\n\ngo 1.21\n`,'main.go':`package main\n\nimport "fmt"\n\nfunc main() {\n\tfmt.Println("Hello, world!")\n}\n`}),
 'C++':()=>({'CMakeLists.txt':`cmake_minimum_required(VERSION 3.16)\nproject(${n_()} CXX)\nadd_executable(app src/main.cpp)\n`,'src/main.cpp':`#include <iostream>\nint main(){ std::cout << "Hello\\n"; return 0; }\n`}),
 'Java':()=>({'src/Main.java':`public class Main {\n    public static void main(String[] a) {\n        System.out.println("Hello");\n    }\n}\n`,'README.md':`# ${n_()}\n\njavac src/Main.java && java -cp src Main\n`}),
 'Godot 4':()=>({'project.godot':`config_version=5\n\n[application]\nconfig/name="${n_()}"\nrun/main_scene="res://scenes/main.tscn"\n`,'scripts/player.gd':`extends CharacterBody2D\n\nconst SPEED = 200.0\n\nfunc _physics_process(_d):\n\tvelocity = Input.get_vector("ui_left","ui_right","ui_up","ui_down") * SPEED\n\tmove_and_slide()\n`,'scenes/':1,'assets/sprites/':1,'assets/audio/':1,'assets/fonts/':1,'data/':1,'docs/':1,'README.md':`# ${n_()}\n\nOpen project.godot in Godot 4. Add scenes/main.tscn in the editor.\n`}),
 'Documentation':()=>DOCS(),
 'Empty':()=>({'README.md':`# ${n_()}\n`})
};
const DOCS=()=>{const n=n_();return{'README.md':`# ${n}\n\n## Description\n\n## Features\n\n## Installation\nSee INSTALLATION.md\n\n## Usage\nSee USER_GUIDE.md\n\n## Structure\nSee ARCHITECTURE.md\n\n## Known limitations\n\n## License\nSee LICENSE (choose a license yourself)\n`,'INSTALLATION.md':`# Installation\n\n1. Requirements\n2. Steps\n`,'USER_GUIDE.md':`# User Guide\n`,'ARCHITECTURE.md':`# Architecture\n\n${tree2(FS.root())||'(generate after adding files)'}\n`,'CHANGELOG.md':`# Changelog\n\n## [Unreleased]\n- Initial files\n`,'CONTRIBUTING.md':`# Contributing\n\nOpen an issue, then a pull request.\n`,'TODO.md':`# TODO\n\n- [ ] First task\n`,'SECURITY.md':`# Security\n\nReport vulnerabilities privately to the maintainer.\n`,'API.md':`# API\n\n## Endpoints / functions\n`,'LICENSE':`<Add your chosen license text here. No license has been selected or verified automatically.>\n`}};
// Language library: [ext, filename, folder, purpose, code]
const LANGS=[
['html','index.html','','Web page entry','<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><title>Page</title></head>\n<body><h1>Hello</h1></body></html>\n'],
['css','style.css','css','Stylesheet',':root{--accent:#6c8cff}\nbody{font-family:system-ui;color:#222}\n'],
['js','main.js','src','JavaScript entry',"const greet = n => `Hello, ${n}!`;\nconsole.log(greet('world'));\n"],

const Store={
 db:()=>new Promise((res,rej)=>{const r=indexedDB.open('kvect-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}),
 async tx(mode,fn){const d=await Store.db();return new Promise((res,rej)=>{const t=d.transaction('p',mode),q=fn(t.objectStore('p'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 async save(){try{await Store.tx('readwrite',s=>s.put({name:S.name,files:S.files,folders:[...S.folders]},S.name));try{localStorage.setItem('kvect.last',S.name)}catch{}log('Saved "'+S.name+'" to browser storage','ok')}catch(e){log('Save failed ('+(e&&e.name==='QuotaExceededError'?'storage quota exceeded':e)+'). Use Export ZIP as backup.','er')}},
 keys:()=>Store.tx('readonly',s=>s.getAllKeys()),
 async load(n){const r=await Store.tx('readonly',s=>s.get(n));if(!r)return false;S.name=r.name;S.files=r.files;S.folders=new Set(r.folders);S.open=[];S.cur='';S.sel='';S.exp=new Set(['']);for(const d of FS.dirs())S.exp.add(d);return true},
 del:n=>Store.tx('readwrite',s=>s.delete(n))

/* ===== 12. ZIP / EXPORT (store-only ZIP, local CRC32) ===== */
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function makeZip(entries){const enc=new TextEncoder(),parts=[],cen=[];let off=0,cs=0;
 for(const e of entries){const n=enc.encode(e.name),d=e.data,c=crc(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);
  parts.push(h,n,d);
  const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x800,true);g.setUint32(16,c,true);g.setUint32(20,d.length,true);g.setUint32(24,d.length,true);g.setUint16(28,n.length,true);g.setUint32(42,off,true);
  cen.push(g,n);cs+=46+n.length;off+=30+n.length+d.length}
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e],{type:'application/zip'})}
const Exp={
 async zip(){const en=[],ds=FS.dirs();for(const d of ds)en.push({name:d+'/',data:new Uint8Array(0)});
  for(const p in S.files)en.push({name:p,data:await FS.bytes(S.files[p])});
  const b=makeZip(en);dl(b,S.name+'.zip');log(`ZIP exported: ${Object.keys(S.files).length} files, ${ds.size} folders, ${sz(b.size)}, 0 skipped`,'ok')},
 file(){const p=S.cur;if(!p)return log('Open a file first','wn');const f=S.files[p];dl(f.b||new Blob([f.c],{type:'text/plain'}),p.split('/').pop())},
 async html(){const D={};for(const p in S.files){const f=S.files[p];D[p]=f.b?await du(f.b):f.c}
  const js=`const D=${JSON.stringify(D).replace(/</g,'\\u003c')};const l=document.getElementById('l'),v=document.getElementById('v');
for(const p in D){const li=document.createElement('li');li.textContent=p;li.style.cursor='pointer';li.onclick=()=>{const d=D[p];v.innerHTML='';
if(d.startsWith('data:image'))v.innerHTML='<img src="'+d+'">';else if(d.startsWith('data:audio'))v.innerHTML='<audio controls src="'+d+'"></audio>';else if(d.startsWith('data:')){const a=document.createElement('a');a.href=d;a.download=p.split('/').pop();a.textContent='Download '+p;v.append(a)}else{const pr=document.createElement('pre');pr.textContent=d;v.append(pr)}};l.append(li)}`;
  const h=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(S.name)} (snapshot)</title><style>body{font:14px system-ui;display:flex;gap:20px;padding:16px}pre{white-space:pre-wrap}</style></head><body><ul id="l"></ul><div id="v"><p>Select a file. This is a read-only snapshot viewer.</p></div><script>${js}<\/script></body></html>`;
  const b=new Blob([h],{type:'text/html'});dl(b,S.name+'-snapshot.html');log('Standalone HTML snapshot exported ('+sz(b.size)+'). It is a viewer, not a folder tree.','ok')}
};

/* ===== 9/10. EDITORS, PREVIEWS, VALIDATION ===== */
function md(src){let h=esc(src);const bl=[];h=h.replace(/```[\w]*\n([\s\S]*?)```/g,(_,c)=>{bl.push(c);return'\u0000'+(bl.length-1)+'\u0000'});
 h=h.replace(/^(#{1,3}) (.+)$/gm,(_,a,t)=>`<h${a.length}>${t}</h${a.length}>`).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
 .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>/^(https?:|\.|\/|#|[\w-]+\.)/.test(u)?`<a href="${u}" target="_blank" rel="noopener">${t}</a>`:m)
 .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^(\s*)[-*] (.+)$/gm,'<li>$2</li>')
 .replace(/((?:^\|.+\|\n?)+)/gm,t=>'<table>'+t.trim().split('\n').filter(r=>!/^\|[\s:|-]+\|$/.test(r)).map(r=>'<tr>'+r.slice(1,-1).split('|').map(c=>'<td>'+c.trim()+'</td>').join('')+'</tr>').join('')+'</table>')
 .replace(/\n\n/g,'<br><br>');return h.replace(/\u0000(\d+)\u0000/g,(_,i)=>'<pre>'+bl[i]+'</pre>')}
function preview(){S.urls.forEach(URL.revokeObjectURL);S.urls=[];const pv=$('#pv'),p=S.cur,f=S.files[p];if(!f){pv.innerHTML='<div class="em">Nothing to preview</div>';return}
 const k=kind(p),url=()=>{const u=URL.createObjectURL(f.b);S.urls.push(u);return u};
 if(k=='img')pv.innerHTML=`<div style="background:repeating-conic-gradient(#8884 0 25%,#0000 0 50%) 0 0/16px 16px;padding:8px"><img id="im" src="${url()}" style="max-width:100%"></div><p id="imi"></p>`,$('#im').onload=e=>$('#imi').textContent=`${e.target.naturalWidth}×${e.target.naturalHeight} · ${ext(p).toUpperCase()} · ${sz(f.b.size)}`;
 else if(k=='aud')pv.innerHTML=`<audio controls loop src="${url()}" style="width:100%"></audio><p>${sz(f.b.size)}</p>`;
 else if(k=='fnt'){const fam='kv'+Date.now();new FontFace(fam,'url('+url()+')').load().then(ff=>{document.fonts.add(ff);pv.innerHTML=`<label>Size <input type=range min=10 max=72 value=28 oninput="this.parentNode.nextElementSibling.style.fontSize=this.value+'px'"></label><div style="font-family:'${fam}';font-size:28px"><h2>The quick brown fox</h2><p>Jumps over the lazy dog 0123456789</p><button>Button</button></div><p>${sz(f.b.size)}</p>`}).catch(e=>pv.textContent='Font failed to load: '+e)}
 else if(f.b)pv.innerHTML=`<div class="em">Binary file · ${sz(f.b.size)}</div>`;
 else if(k=='md')pv.innerHTML=`<div class="md">${md(f.c)}</div>`;
 else if(k=='svg'){const u=URL.createObjectURL(new Blob([f.c],{type:'image/svg+xml'}));S.urls.push(u);pv.innerHTML=`<img src="${u}" style="max-width:100%;background:#fff">`}
 else if(k=='json'){try{JSON.parse(f.c);pv.innerHTML='<span class=ok>✔ Valid JSON</span>'}catch(e){pv.innerHTML='<span class=er>✖ '+esc(e.message)+'</span>'}}
 else if(k=='csv')pv.innerHTML='<table class="md">'+f.c.trim().split('\n').map(r=>'<tr>'+r.split(',').map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>';
 else if(k=='html')pv.innerHTML='<iframe sandbox style="width:100%;height:100%;border:0;background:#fff" srcdoc="'+esc(f.c)+'"></iframe>'; // sandbox: no scripts run
 else pv.innerHTML='<div class="em">Plain-text file (no syntax highlighting; shown as plain text)</div>'}

function jparse(txt){let j;try{j=JSON.parse(txt)}catch(e){throw Error('Invalid JSON: '+e.message)}

  if(o.type=='folder'||Array.isArray(o.children)){add('d',p);(o.children||[]).forEach(c=>node(c,p,d+1))}else if(o.binary)sk++;else add('f',p,o.content)};
 const sh=(o,base,d)=>{if(d>40)throw Error('Nesting too deep (max 40)');for(const k of Object.keys(o)){const v=o[k],p=base?base+'/'+k:k;if(v&&typeof v=='object'&&!Array.isArray(v)){add('d',p);sh(v,p,d+1)}else add('f',p,typeof v=='string'?v:'')}};
 if(Array.isArray(j))j.forEach(x=>{if(typeof x=='string')x.endsWith('/')?add('d',x,''):add('f',x,'');else node(x,'',0)});
 else if(j&&typeof j=='object'&&(j.type||Array.isArray(j.children))){root=clean(String(j.name||''));(j.children||[]).forEach(c=>node(c,'',0))}
 else if(j&&typeof j=='object')sh(j,'',0);else throw Error('Top level must be an object or an array');
 return{root,ops,skipped:sk}}

function skinCSS(){const lum=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000};
 return SK2.map(([id,nm,f,L,D])=>[['',L],['[data-theme=dark]',D]].map(([m,[bg,p,b,t,mu,a,c1,c2,tc,ed]])=>{const q='html[data-skin='+id+']'+m;
  return q+'{--bg:'+bg+';--p:'+p+';--b:'+b+';--t:'+t+';--m:'+mu+';--a:'+a+';--tb:linear-gradient('+c1+','+c2+');--tbc:'+tc+';--tbbc:'+tc+';--tbb:#ffffff33;--tbx:#00000044;--hd:linear-gradient('+c2+','+c1+');--hdc:'+tc+';--bt:linear-gradient('+p+','+bg+');--ed:'+ed+';--ib:'+ed+'}'+q+' header b{color:'+tc+'}'+q+' .r.s{color:'+(lum(a)>150?'#000':'#fff')+'}'}).join('')+(f?'html[data-skin='+id+'] body{font-family:'+f+'}':'')).join('')}

const LY={list:[],snap:0,lock:false,
 async load(){try{const r=await Store.tx('readonly',s=>s.get('__layouts__'));if(r){this.list=r.list||[];this.snap=r.snap||0;this.lock=!!r.lock}}catch{}},
 async persist(){try{await Store.tx('readwrite',s=>s.put({list:LY.list,snap:LY.snap,lock:LY.lock},'__layouts__'))}catch(e){log('Layout save failed: '+e,'er')}},
 cur(){WM.sync();const M=WM.M(),W=M.clientWidth||1,H=M.clientHeight||1,o={};WM.ids.forEach(i=>{const s=WM.L[i],r=s.mx&&s.prev?s.prev:s;o[i]={x:r.x/W,y:r.y/H,w:r.w/W,h:r.h/H,s:s.s||''}});return o},
 apply(o){const M=WM.M(),W=M.clientWidth,H=M.clientHeight;WM.ids.forEach(i=>{const f=o[i];if(f)WM.L[i]={x:Math.round(f.x*W),y:Math.round(f.y*H),w:Math.round(f.w*W),h:Math.round(f.h*H),s:f.s||''}});WM.clamp();WM.save()},
 built:{
  'Tile (default)':()=>WM.tile(),
  'Code focus':()=>{const W=WM.M().clientWidth,H=WM.M().clientHeight,r=(x,y,w,h,s='')=>({x,y,w,h,s}),m=r(0,0,W,H,'min');return{'w-ex':r(0,0,200,H),'w-ed':r(206,0,W-206,H*.72),'w-lg':r(206,H*.72+6,W-206,H*.28-6),'w-pv':m,'w-st':m,'w-ac':m}},
  'Editor + preview':()=>{const W=WM.M().clientWidth,H=WM.M().clientHeight,r=(x,y,w,h,s='')=>({x,y,w,h,s}),m=r(0,0,W,H,'min'),h=H*.78,c=(W-226)/2;return{'w-ex':r(0,0,220,h),'w-ed':r(226,0,c-3,h),'w-pv':r(226+c+3,0,c-3,h),'w-lg':r(0,h+6,W,H-h-6),'w-st':m,'w-ac':m}},
  'Cascade':()=>{const M=WM.M(),o={};WM.ids.forEach((i,n)=>o[i]={x:n*28,y:n*28,w:M.clientWidth*.55,h:M.clientHeight*.6,s:''});return o}}};
function layDlg(){
 const body=()=>'<h4>Built-in layouts</h4><div class="g">'+Object.keys(LY.built).map(n=>`<button data-a="b:${esc(n)}">${esc(n)}</button>`).join('')+'</div>'
  +'<h4>My layouts <button data-a="save">＋ Save current arrangement</button></h4>'+(LY.list.map((l,i)=>`<div>${esc(l.name)} <button data-a="a:${i}">Apply</button><button data-a="d:${i}">Delete</button></div>`).join('')||'<div class="em">None yet. Arrange the windows, then save.</div>')
  +'<h4>Windows</h4><div class="g">'+WM.ids.map(i=>`<button data-a="v:${i}">${WM.L[i].s?'Show':'Hide'} ${esc(WM.el(i).dataset.title)}</button>`).join('')+'</div>'
  +`<h4>Behaviour</h4><div class="g"><button data-a="snap">Grid snap: ${LY.snap?LY.snap+' px':'off'}</button><button data-a="lock">Layout lock: ${LY.lock?'on':'off'}</button></div>`;
 dlg('<h3>Layouts</h3><p>Saved layouts store sizes as fractions of the workspace, so they fit other screen sizes.</p><div id="lyb">'+body()+'</div>',a=>{
  const k=a.split(':')[0],v=a.slice(k.length+1);
  if(k=='b'){WM.L=Object.assign({},WM.tile(),LY.built[v]());WM.applyAll();WM.save()}
  else if(k=='save'){const n=prompt('Layout preset name:');if(!n)return;const i=LY.list.findIndex(l=>l.name==n);if(i>=0&&!confirm('Replace existing layout "'+n+'"?'))return;const e={name:n.slice(0,60),l:LY.cur()};i>=0?LY.list[i]=e:LY.list.push(e);LY.persist();log('Layout "'+n+'" saved','ok')}
  else if(k=='a'){LY.apply(LY.list[v].l)}
  else if(k=='d'){if(confirm('Delete layout "'+LY.list[v].name+'"?')){LY.list.splice(v,1);LY.persist()}}
  else if(k=='v'){WM.state(WM.el(v),WM.L[v].s?'':'x')}
  else if(k=='snap'){LY.snap=LY.snap==0?10:LY.snap==10?20:0;LY.persist();WM.snapAll();WM.save()}
  else if(k=='lock'){LY.lock=!LY.lock;LY.persist()}
  $('#lyb').innerHTML=body()})}
